<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Calm Space</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#dcd0f7"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Calm Space">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf7ff;--card:#fff;--tx:#3d3a56;--mut:#8a86a8;--pink:#f9c6de;--lav:#dcd0f7;--peri:#aab4f0;--blue:#cfe6fb;--acc:#8f9bea;--sh:0 6px 20px rgba(143,155,234,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1c1a2b;--card:#27243a;--tx:#ece9fb;--mut:#a29fc2;--pink:#5a3a50;--lav:#3d3563;--peri:#4a5190;--blue:#2c4560;--acc:#aab4f0;--sh:0 6px 20px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1c1a2b;--card:#27243a;--tx:#ece9fb;--mut:#a29fc2;--pink:#5a3a50;--lav:#3d3563;--peri:#4a5190;--blue:#2c4560;--acc:#aab4f0;--sh:0 6px 20px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif;background-image:linear-gradient(160deg,var(--pink) -40%,transparent 35%),linear-gradient(20deg,var(--blue) -30%,transparent 30%);background-attachment:fixed}
#main{max-width:760px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:1.5rem;margin:6px 0 2px}h2{font-size:1.05rem;margin:0 0 10px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 14px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:16px;margin-bottom:16px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:var(--bg);border:2px solid var(--lav);border-radius:14px;padding:9px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--peri)}
textarea{resize:vertical;min-height:70px}
button{border:0;border-radius:14px;padding:9px 16px;background:linear-gradient(135deg,var(--peri),var(--lav));cursor:pointer;font-weight:700;color:#2e2a52}
button.ghost{background:var(--lav);color:var(--tx)}button.x{background:none;color:var(--mut);padding:2px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input,.row>select{flex:1;min-width:90px;width:auto}
.item{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--lav)}.item:last-child{border:0}
.tag{font-size:.72rem;padding:2px 9px;border-radius:99px;font-weight:700;color:#2e2a52}
.High{background:var(--pink)}.Medium{background:var(--lav)}.Low{background:var(--blue)}
.bar{height:16px;border-radius:99px;background:var(--lav);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--peri));transition:width .4s}
label.ck{display:inline-flex;gap:5px;align-items:center;font-size:.85rem;margin-right:10px}label.ck input{width:auto;accent-color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);box-shadow:0 -6px 20px rgba(143,155,234,.2);border-radius:24px 24px 0 0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;display:flex;flex-direction:column;align-items:center;font-size:.7rem;padding:6px 8px;border-radius:14px;color:var(--mut)}
nav button b{font-size:1.3rem}nav button.on{background:var(--lav);color:var(--tx)}
#chat{height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:85%;padding:10px 14px;border-radius:18px;white-space:pre-wrap}
.m.user{align-self:flex-end;background:linear-gradient(135deg,var(--peri),var(--lav));color:#2e2a52;border-bottom-right-radius:4px}
.m.assistant{align-self:flex-start;background:var(--blue);border-bottom-left-radius:4px}
.priv{font-size:.78rem;color:var(--mut);background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:10px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--lav)}
.sw{width:50px;height:28px;border-radius:99px;background:var(--lav);position:relative;cursor:pointer;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}.sw.on:after{left:25px}
.dots span{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--lav);margin-right:4px}.dots span.on{background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.grid div{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:var(--sh)}.grid img{width:100%;height:100%;object-fit:cover}
.grid button{position:absolute;top:4px;right:4px;padding:0 8px;background:rgba(255,255,255,.8)}
.big{font-size:2.4rem;font-weight:800;text-align:center;letter-spacing:2px}
.mood{display:flex;gap:6px;flex-wrap:wrap}.mood button{background:var(--bg);font-size:1.4rem;padding:6px 10px}.mood button.on{background:var(--pink)}
.done{text-decoration:line-through;color:var(--mut)}
</style></head><body>
<div id="main"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={};try{S=JSON.parse(localStorage.getItem('calm')||'{}')}catch(e){}
Object.entries({chat:[],refl:[],topics:[],rage:[],dist:[],cry:[],disc:{},gym:[],period:[],todos:[],board:[],mood:null,share:false,alarm:''}).forEach(([k,v])=>{if(S[k]===undefined)S[k]=v});
let saveErr=false;
const save=()=>{try{localStorage.setItem('calm',JSON.stringify(S));saveErr=false}catch(e){saveErr=true;alert('Storage is full or unavailable. Try removing some mood board images.')}};
const now=()=>new Date(),dk=(d=now())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=t=>new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TABS=[['ai','💬','Therapy'],['reflect','🪷','Reflect'],['study','📚','Study'],['mind','🌙','Mind'],['disc','🎯','Discipline'],['fit','🌸','Fitness']];
let cur='ai';
function go(t){cur=t;render()}
function render(){
 $('#nav').innerHTML=TABS.map(([k,i,n])=>`<button class="${k==cur?'on':''}" onclick="go('${k}')"><b>${i}</b>${n}</button>`).join('');
 $('#main').innerHTML=V[cur]();window.scrollTo(0,0);if(cur=='ai')drawChat();
}
/* ---------- THERAPY ---------- */
const EM=[['😞',2,'very low'],['😕',4,'low'],['😐',5,'neutral'],['🙂',7,'good'],['😄',9,'great']];
function setMood(i){S.mood={score:EM[i][1],label:EM[i][2],e:EM[i][0],d:dk()};save();render()}
function addRefl(){const g=i=>$('#'+i).value.trim();if(!g('r1')&&!g('r3'))return;S.refl.unshift({t:Date.now(),a:g('r1'),b:g('r2'),c:g('r3'),d:g('r4'),e:g('r5'),f:g('r6')});save();render()}
function delRefl(i){if(confirm('Delete this reflection?')){S.refl.splice(i,1);save();render()}}
const RQ=[['r1','What happened? (just the facts)'],['r2','What did you feel, and how strongly (0–100)?'],['r3','What thought went through your mind?'],['r4','What supports that thought?'],['r5','What doesn’t support it, or what would you tell a friend?'],['r6','A kinder, more balanced thought']];
const SYS=`You are a warm, grounded, non-judgmental supportive therapist in a private journaling app. Use active listening, validation, gentle open-ended reflective questions, and CBT-informed techniques (identifying thoughts, feelings and behaviours, noticing cognitive distortions, reframing, behavioural experiments) when they fit. Keep replies fairly short (under 150 words), conversational, and ask at most one question at a time. Do not diagnose. You are not a replacement for a licensed professional. If the person mentions self-harm, suicide or being in danger, respond with care, encourage them to contact local emergency services or a crisis line and a trusted person right away. You only know what is said in this conversation.`;
let busy=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),status=t=>{const e=$('#st');if(e)e.textContent=t};
function drawChat(){const c=$('#chat');if(!c)return;c.innerHTML=(S.chat.length?'':'<div class="m assistant">Hi, I’m here and listening. What’s on your mind today?</div>')+S.chat.map(m=>`<div class="m ${m.role}">${esc(m.content)}</div>`).join('');c.scrollTop=c.scrollHeight}
function shareMood(el){S.share=el.checked;save()}
function newSession(){if(confirm('Start a fresh session? This clears the current conversation.')){S.chat=[];save();render()}}
function setKey(){const k=prompt('Paste your Gemini API key (kept only in this browser):',localStorage.getItem('gemini_key')||'');if(k!==null)localStorage.setItem('gemini_key',k.trim())}
function setModel(){const m=prompt('Main Gemini model name (see Google AI Studio):',localStorage.getItem('gemini_model')||'gemini-flash-latest');if(m)localStorage.setItem('gemini_model',m.trim());const b=prompt('Backup model, used when the main one is busy:',localStorage.getItem('gemini_backup')||'gemini-flash-lite-latest');if(b)localStorage.setItem('gemini_backup',b.trim())}
async function callGemini(key,contents){
 const models=[localStorage.getItem('gemini_model')||'gemini-flash-latest',localStorage.getItem('gemini_backup')||'gemini-flash-lite-latest'];
 let last='Unknown error';
 for(const model of models){
  for(let a=0;a<3;a++){
   let r,j;
   try{
    r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents})});
    j=await r.json().catch(()=>({}));
   }catch(e){last='Network problem';status('Connection hiccup, retrying…');await wait(1500*(a+1));continue}
   if(r.ok){const t=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts.map(p=>p.text).join('');if(t)return t;last='Empty response';break}
   last=(j.error&&j.error.message)||('Error '+r.status);
   if(r.status==400||r.status==401||r.status==403){const e=new Error(last);e.fatal=1;throw e}
   if(r.status==404)break;
   if(r.status==429||r.status>=500){status('Gemini is busy, retrying…');await wait(1500*(a+1));continue}
   break;
  }
  status('Trying backup model…');
 }
 throw new Error(last);
}
async function send(){
 const el=$('#in'),txt=el.value.trim();if(!txt||busy)return;
 let key=localStorage.getItem('gemini_key');if(!key){setKey();key=localStorage.getItem('gemini_key');if(!key)return}
 busy=true;el.value='';S.chat.push({role:'user',content:txt});save();drawChat();status('Thinking…');
 const mood=S.share&&S.mood&&S.mood.d==dk()?`\n\n[Context from mood check-in: today I rate my mood ${S.mood.score}/10 (${S.mood.label}).]`:'';
 const contents=S.chat.map(m=>({role:m.role=='assistant'?'model':'user',parts:[{text:m.content}]}));
 contents[contents.length-1].parts[0].text+=mood;
 try{const t=await callGemini(key,contents);S.chat.push({role:'assistant',content:t});save();status('')}
 catch(e){S.chat.pop();save();el.value=txt;status('Couldn’t get a reply: '+e.message+(e.fatal?' (check your API key)':' Your message is kept, try again in a moment.'))}
 busy=false;drawChat();
}
/* ---------- STUDY ---------- */
const pct=()=>{const n=S.topics.length;return n?Math.round(S.topics.reduce((a,t)=>a+t.n+t.q+t.m,0)/(n*3)*100):0};
function addTopic(){const t=$('#tt').value.trim();if(!t)return;S.topics.push({id:uid(),t,p:$('#tp').value,n:0,q:0,m:0});save();render()}
function chk(id,k,v){const t=S.topics.find(x=>x.id==id);t[k]=v?1:0;save();$('#pb').style.width=pct()+'%';$('#pv').textContent=pct()+'%'}
function delT(id){S.topics=S.topics.filter(x=>x.id!=id);save();render()}
/* ---------- MIND ---------- */
function addLog(k,id){const e=$('#'+id),v=e.value.trim();if(!v)return;S[k].unshift({t:Date.now(),x:v});save();render()}
function delLog(k,i){S[k].splice(i,1);save();render()}
function logCry(){S.cry.unshift(Date.now());save();render()}
/* ---------- DISCIPLINE ---------- */
const DQ=[['wake','⏰','Woke up to my alarm on time'],['reels','📱','Kept Reels/Shorts under control'],['msgs','💬','Checked messages with control'],['dep','🌱','Managed my dependency on others']];
function tg(k){const d=dk();S.disc[d]=S.disc[d]||{};S.disc[d][k]=!S.disc[d][k];save();render()}
/* ---------- FITNESS & UTILITY ---------- */
function addGym(){const g=id=>$('#'+id).value;if(!g('ge').trim())return;S.gym.unshift({d:dk(),e:g('ge').trim(),s:g('gs'),r:g('gr'),w:g('gw')});save();render()}
function addPeriod(){const v=$('#pd').value;if(!v)return;if(!S.period.includes(v))S.period.push(v);S.period.sort();save();render()}
function periodInfo(){const p=S.period;if(!p.length)return'Log the first day of your period to see predictions.';
 const ds=p.map(x=>new Date(x+'T00:00')),gaps=ds.slice(1).map((d,i)=>Math.round((d-ds[i])/864e5)).filter(g=>g>15&&g<60).slice(-6);
 const avg=gaps.length?Math.round(gaps.reduce((a,b)=>a+b)/gaps.length):28,next=new Date(ds[ds.length-1].getTime()+avg*864e5),
 diff=Math.round((next-new Date(dk()+'T00:00'))/864e5);
 return `Average cycle: ${avg} days${gaps.length?'':' (default until you log more)'}.<br><b>Next period around ${next.toLocaleDateString([], {month:'long',day:'numeric'})}</b> — ${diff>0?'in '+diff+' day'+(diff==1?'':'s'):diff==0?'expected today':Math.abs(diff)+' day(s) past the estimate'}.${diff<=3&&diff>=0?'<br>🌸 Reminder: it’s coming up soon.':''}`}
function addTodo(){const v=$('#td').value.trim();if(!v)return;S.todos.push({id:uid(),x:v,d:0});save();render()}
function tdo(id){const t=S.todos.find(x=>x.id==id);t.d=!t.d;save();render()}
function delTodo(id){S.todos=S.todos.filter(x=>x.id!=id);save();render()}
let tLeft=0,tInt=null,aInt=null;
function beep(){try{const a=new AudioContext();[0,.35,.7].forEach(o=>{const s=a.createOscillator();s.connect(a.destination);s.frequency.value=660;s.start(a.currentTime+o);s.stop(a.currentTime+o+.2)})}catch(e){}}
const tfmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function startT(m){clearInterval(tInt);tLeft=m*60;tick();tInt=setInterval(tick,1000)}
function stopT(){clearInterval(tInt);tLeft=0;tick()}
function tick(){const e=$('#tm');if(tLeft<=0&&tInt&&e){clearInterval(tInt);tInt=null;if(e.dataset.run){beep();alert('⏰ Timer finished!')}}if(e){e.textContent=tfmt(Math.max(tLeft,0));e.dataset.run=tLeft>0?1:''}if(tLeft>0)tLeft--}
function setAlarm(){S.alarm=$('#al').value;save();render()}
clearInterval(aInt);aInt=setInterval(()=>{if(!S.alarm)return;const n=now(),h=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');if(h==S.alarm&&n.getSeconds()<6){beep();S.alarm='';save();alert('⏰ Alarm!');if(cur=='fit')render()}},5000);
function addImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.board.push({id:uid(),u:c.toDataURL('image/jpeg',.7)});save();render()};im.src=r.result};r.readAsDataURL(f)}
function delImg(id){S.board=S.board.filter(x=>x.id!=id);save();render()}
/* ---------- VIEWS ---------- */
const logCard=(k,title,ph,id,note)=>`<div class="card"><h2>${title}</h2><textarea id="${id}" placeholder="${ph}"></textarea><div class="row" style="margin-top:8px"><button onclick="addLog('${k}','${id}')">Save</button></div>${S[k].map((l,i)=>`<div class="item"><div><small style="color:var(--mut)">${fmt(l.t)}</small><div style="white-space:pre-wrap">${esc(l.x)}</div></div><button class="x" onclick="delLog('${k}',${i})">✕</button></div>`).join('')}<div class="priv">${note}</div></div>`;
const V={
ai:()=>`<h1>Therapy</h1><p class="sub">A quiet place to talk things through.</p>
<div class="card"><div class="mood">${EM.map((e,i)=>`<button class="${S.mood&&S.mood.d==dk()&&S.mood.score==e[1]?'on':''}" onclick="setMood(${i})" title="${e[2]}">${e[0]}</button>`).join('')}</div>
<label class="ck" style="margin-top:10px"><input type="checkbox" ${S.share?'checked':''} onchange="shareMood(this)"> Share today’s mood with my therapist</label></div>
<div class="card"><div id="chat"></div><div id="st" class="sub" style="margin:8px 0 0;min-height:1.2em"></div><div class="row" style="margin-top:6px"><textarea id="in" style="flex:1;min-height:48px" placeholder="Write whatever feels true right now…" onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button onclick="send()">Send</button></div>
<div class="row" style="margin-top:8px"><button class="ghost" onclick="newSession()">New session</button><button class="ghost" onclick="setKey()">API key</button><button class="ghost" onclick="setModel()">Models</button></div>
<div class="priv">🔒 Messages here are sent to Google’s Gemini API. The therapist only sees this conversation (plus your mood if you tick the box). Your Rage Diary, Distraction Log and everything else never leave your device. This is supportive AI, not a licensed professional. In a crisis, contact local emergency services or a crisis line.</div></div>`,
reflect:()=>`<h1>Reflect</h1><p class="sub">A gentle, private space to untangle your thoughts.</p>
<div class="card"><h2>How are you feeling today?</h2><div class="mood">${EM.map((e,i)=>`<button class="${S.mood&&S.mood.d==dk()&&S.mood.score==e[1]?'on':''}" onclick="setMood(${i})" title="${e[2]}">${e[0]}</button>`).join('')}</div></div>
<div class="card"><h2>New reflection</h2>${RQ.map(([i,q])=>`<p style="margin:10px 0 4px"><b>${q}</b></p><textarea id="${i}"></textarea>`).join('')}<div class="row" style="margin-top:10px"><button onclick="addRefl()">Save reflection</button></div>
<div class="priv">🔒 Stays on this device only. This is a self-help tool, not therapy. If you feel unsafe or in crisis, please contact local emergency services, a crisis line, or someone you trust right away.</div></div>
${S.refl.map((r,i)=>`<div class="card"><div class="row" style="justify-content:space-between"><small style="color:var(--mut)">${fmt(r.t)}</small><button class="x" onclick="delRefl(${i})">✕</button></div>${RQ.map(([k,q],n)=>r['abcdef'[n]]?`<p style="margin:6px 0"><small style="color:var(--mut)">${q}</small><br><span style="white-space:pre-wrap">${esc(r['abcdef'[n]])}</span></p>`:'').join('')}</div>`).join('')}`,
study:()=>`<h1>Study Hub</h1><p class="sub">Small steps, steady progress.</p>
<div class="card"><h2>Preparation <span id="pv" style="float:right">${pct()}%</span></h2><div class="bar"><i id="pb" style="width:${pct()}%"></i></div></div>
<div class="card"><div class="row"><input id="tt" placeholder="Add a syllabus topic" onkeydown="if(event.key=='Enter')addTopic()"><select id="tp" style="max-width:110px"><option>High</option><option selected>Medium</option><option>Low</option></select><button onclick="addTopic()">Add</button></div>
${['High','Medium','Low'].map(p=>S.topics.filter(t=>t.p==p).map(t=>`<div class="item"><div><span class="tag ${p}">${p}</span> <b>${esc(t.t)}</b><div style="margin-top:6px"><label class="ck"><input type="checkbox" ${t.n?'checked':''} onchange="chk('${t.id}','n',this.checked)">Notes</label><label class="ck"><input type="checkbox" ${t.q?'checked':''} onchange="chk('${t.id}','q',this.checked)">PYQs</label><label class="ck"><input type="checkbox" ${t.m?'checked':''} onchange="chk('${t.id}','m',this.checked)">Mastered</label></div></div><button class="x" onclick="delT('${t.id}')">✕</button></div>`).join('')).join('')||'<p class="sub" style="margin-top:12px">No topics yet.</p>'}</div>`,
mind:()=>`<h1>Mind &amp; Diaries</h1><p class="sub">Private, local, yours.</p>
${logCard('rage','🔥 Rage Diary','Let it all out. No filter.','rg','Stored only on this device. Never shared with AI or anyone else.')}
${logCard('dist','💭 Distraction Log','Jot down the thought, then get back to work.','ds','Stored only on this device.')}
<div class="card"><h2>💧 Cry Tracker</h2><button onclick="logCry()">Log now</button>${S.cry.map((t,i)=>`<div class="item"><span>${fmt(t)}</span><button class="x" onclick="S.cry.splice(${i},1);save();render()">✕</button></div>`).join('')}</div>`,
disc:()=>{const d=S.disc[dk()]||{};return`<h1>Discipline</h1><p class="sub">Today’s check-in · ${now().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})}</p>
<div class="card">${DQ.map(([k,i,l])=>`<div class="tog"><span>${i} ${l}</span><div class="sw ${d[k]?'on':''}" onclick="tg('${k}')"></div></div>`).join('')}</div>
<div class="card"><h2>Last 7 days</h2>${DQ.map(([k,i,l])=>`<div class="item"><span>${i}</span><span class="dots">${[6,5,4,3,2,1,0].map(n=>{const x=new Date();x.setDate(x.getDate()-n);return`<span class="${(S.disc[dk(x)]||{})[k]?'on':''}"></span>`}).join('')}</span></div>`).join('')}</div>`},
fit:()=>`<h1>Fitness &amp; Life</h1><p class="sub">Body, cycle, tasks and inspiration.</p>
<div class="card"><h2>🏋️ Gym Tracker</h2><div class="row"><input id="ge" placeholder="Exercise"><input id="gs" type="number" placeholder="Sets" style="max-width:70px"><input id="gr" type="number" placeholder="Reps" style="max-width:70px"><input id="gw" type="number" placeholder="kg" style="max-width:70px"><button onclick="addGym()">Log</button></div>
${S.gym.slice(0,15).map((g,i)=>`<div class="item"><span><b>${esc(g.e)}</b> · ${esc(g.s||'-')}×${esc(g.r||'-')} @ ${esc(g.w||'-')} kg <small style="color:var(--mut)">${g.d}</small></span><button class="x" onclick="S.gym.splice(${i},1);save();render()">✕</button></div>`).join('')}</div>
<div class="card"><h2>🌸 Period Tracker</h2><div class="row"><input id="pd" type="date" value="${dk()}"><button onclick="addPeriod()">Log start day</button></div><p>${periodInfo()}</p><small style="color:var(--mut)">${S.period.slice(-6).reverse().join(' · ')}</small></div>
<div class="card"><h2>✅ To-Do</h2><div class="row"><input id="td" placeholder="New task" onkeydown="if(event.key=='Enter')addTodo()"><button onclick="addTodo()">Add</button></div>${S.todos.map(t=>`<div class="item"><label class="ck ${t.d?'done':''}"><input type="checkbox" ${t.d?'checked':''} onchange="tdo('${t.id}')">${esc(t.x)}</label><button class="x" onclick="delTodo('${t.id}')">✕</button></div>`).join('')}</div>
<div class="card"><h2>⏳ Focus Timer &amp; Alarm</h2><div class="big" id="tm">${tfmt(Math.max(tLeft,0))}</div><div class="row" style="justify-content:center;margin:10px 0"><button onclick="startT(25)">25 min</button><button onclick="startT(50)">50 min</button><button onclick="startT(5)">5 min</button><button class="ghost" onclick="stopT()">Stop</button></div>
<div class="row"><input id="al" type="time" value="${S.alarm}"><button onclick="setAlarm()">${S.alarm?'Update alarm':'Set alarm'}</button>${S.alarm?`<button class="ghost" onclick="S.alarm='';save();render()">Clear</button>`:''}</div><small style="color:var(--mut)">Timer and alarm ring only while this page is open.</small></div>
<div class="card"><h2>🖼️ Mood Board</h2><input type="file" accept="image/*" onchange="addImg(this)" style="margin-bottom:10px"><div class="grid">${S.board.map(b=>`<div><img src="${b.u}" alt="Inspiration"><button onclick="delImg('${b.id}')">✕</button></div>`).join('')}</div></div>`
};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
